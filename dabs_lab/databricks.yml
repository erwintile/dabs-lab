# This is a Declarative Automation Bundle definition for dabs_lab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabs_lab
  uuid: ee82f8c1-e1e3-42e4-930e-caeb02f35e09

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606071868680.0.azuredatabricks.net
    variables:
      catalog: nrn_dbr_evaluation_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405606071868680.0.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ti.le@norrin.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ti.le@norrin.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nrn_dbr_evaluation_dev
      schema: prod
    permissions:
      - user_name: ti.le@norrin.com
        level: CAN_MANAGE
